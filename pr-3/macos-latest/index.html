<script id="report-data" type="application/json">{"generated_platform": "Darwin", "summary": {"failed": 0, "passed": 21, "skipped": 0}, "tutorials": [{"meta": {"name": "Calling Modules and Subscribing to Events from Outside", "platform": "Darwin (ext=dylib)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Calling Modules and Subscribing to Events from Outside\n\nThe `json_rpc_bridge` module gives a Logos node an outside edge. Without it,\nevery consumer of a module's methods or events has to be a loaded module\nitself \u2014 which leaves scripts, dashboards, test harnesses and other language\nruntimes with no way in at all.\n\nYou start it with a config JSON naming exactly which modules to expose, and it\nstands up an HTTP + WebSocket server speaking JSON-RPC 2.0. HTTP carries method\ncalls; WebSocket carries method calls *and* event subscriptions, with the\nserver pushing events as they happen.\n\nThis doc-test proves the whole thing end-to-end on the commit under test:\n\n1. Create a **provider** module inline. It has a method that succeeds, a\n   method that reports an application-level failure, and an event it emits on\n   demand.\n2. Build the bridge from **this repo**, run both under a `logoscore` daemon,\n   and start the bridge over an explicit allowlist.\n3. Call the provider over HTTP \u2014 with **by-name** params and with\n   **positional** params \u2014 and through the REST projection, asserting all\n   three agree.\n4. Prove the security posture: a browser `Origin` is refused, a non-JSON\n   content type is refused, and a denied method is byte-identical to a module\n   that does not exist.\n5. Open **two concurrent WebSocket clients**, subscribe both, trigger the\n   event, and assert each receives it under its own caller-assigned\n   subscription id.\n\nA green run means an external client drove a real module through the bridge,\ntwo clients received the same event independently, and none of the refusals\nleaked which one it was.\n\n**What you'll build:** A provider module plus the `json_rpc_bridge` (built from this repo) running together under a `logoscore` daemon; `curl` drives method calls over HTTP and two concurrent `websocat` clients receive a pushed event.\n\n**What you'll learn:**\n\n- How to expose a module's methods and events to external clients\n- The `rpc.call` shape, and why module and method are separate fields rather than a dotted name\n- That by-name and positional params are both accepted and mean the same thing\n- How event subscriptions work over WebSocket, with client-assigned subscription ids\n- Why an application-level failure arrives as a JSON-RPC `result`, not an `error`\n- How the bridge refuses browser origins, and why a loopback bind is not enough on its own\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- **git** \u2014 nix flakes only see files tracked by git.\n- **curl** and **websocat** \u2014 to drive HTTP and WebSocket.\n- A Linux or macOS machine."}, {"execs": [], "md": "## Step 1: Create a provider module\n\nA module becomes reachable through the bridge by being named in the\nbridge's `expose.modules` list \u2014 there is nothing to implement and no\ninterface to adopt. This provider is an ordinary `universal` (pure-C++)\nmodule with three things worth exercising:\n\n```cpp\nstd::string        greet(const std::string& who);   // plain success\nStdLogosResult     mustFail();                      // application failure\nint64_t            fire(int64_t value);             // emits an event\nlogos_events:\n    void tick(int64_t value);\n```\n\n`mustFail()` matters more than it looks: a module that answers\n`{success:false}` has **answered the call**. The bridge must deliver that\nin the JSON-RPC `res xecs": [{"cmd": "./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file bridge-lgx/*.lgx", "exit_code": 0, "kind": "run", "note": "", "output": "Installing from file: bridge-lgx/logos-json_rpc_bridge-module-lib.lgx... done\nInstalled to: ./modules\n", "status": "pass"}], "md": "### 2.6 Install the bridge\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file bridge-lgx/*.lgx\n```"}, {"execs": [], "md": "## Step 3: Start the node and the bridge\n\nStart the daemon, load both modules, then `start` the bridge over an\nexplicit allowlist. There is **no wildcard**: every module reachable from\noutside is named here, and `provider_module`'s `mustFail` is left exposed\nwhile a `denied` method name is not \u2014 which the refusal test below uses.\n\nNote what `start` returns: the resolved exposure, the bound endpoints, and\n`subscription_continuity`, which tells you whether the running protocol can\nreport a provider restart."}, {"execs": [{"cmd": "nohup ./logos/bin/logoscore --config-dir . -D -m ./modules > daemon.log 2>&1 &\nsleep 6\n", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 3.1 Start the daemon\n\n```bash\nlogoscore -D -m ./modules\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore --config-dir . load-module provider_module\n./logos/bin/logoscore --config-dir . load-module json_rpc_bridge\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[],\"module\":\"provider_module\",\"status\":\"ok\",\"version\":\"1.0.0\"}\n{\"dependencies_loaded\":[],\"module\":\"json_rpc_bridge\",\"status\":\"ok\",\"version\":\"0.1.0\"}\n", "status": "pass"}], "md": "### 3.2 Load both modules\n\n```bash\nlogoscore load-module provider_module\nlogoscore load-module json_rpc_bridge\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore --config-dir . call json_rpc_bridge start '{\"http\":{\"port\":8645},\"expose\":{\"modules\":[{\"name\":\"provider_module\",\"methods\":{\"deny\":[\"denied\"]}}]}}'\nsleep 2\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"start\",\"module\":\"json_rpc_bridge\",\"result\":{\"error\":null,\"success\":true,\"value\":{\"auth\":\"none\",\"connections\":0,\"http\":\"http://127.0.0.1:8645\",\"modules\":[{\"events\":{\"allow\":null,\"deny\":[]},\"methods\":{\"allow\":null,\"deny\":[\"denied\"]},\"name\":\"provider_module\"}],\"protocol_version\":\"0.9.0\",\"running\":true,\"subscription_continuity\":true,\"subscriptions\":0,\"upstream_subscriptions\":0,\"ws\":\"ws://127.0.0.1:8645/ws\"}},\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.3 Start the bridge\n\n```bash\nlogoscore call json_rpc_bridge start '{\n  \"http\": {\"port\": 8645},\n  \"expose\": {\"modules\": [\n    {\"name\": \"provider_module\", \"methods\": {\"deny\": [\"denied\"]}}\n  ]}\n}'\n```"}, {"execs": [{"cmd": "curl -s --max-time 15 http://127.0.0.1:8645/healthz", "exit_code": 0, "kind": "run", "note": "", "output": "{\"protocol\":\"json-rpc-2.0\",\"status\":\"ok\",\"uptime_seconds\":2}", "status": "pass"}], "md": "### 3.4 The node is healthy\n\n```bash\ncurl -s --max-time 15 http://127.0.0.1:8645/healthz\n```"}, {"execs": [{"cmd": "curl -s --max-time 15 http://127.0.0.1:8645/modules", "exit_code": 0, "kind": "run", "note": "", "output": "[{\"authoritative\":false,\"events\":[\"tick\"],\"events_declared\":true,\"methods\":[\"greet\",\"mustFail\",\"fire\",\"name\",\"version\"],\"module\":\"provider_module\",\"resolved\":true,\"source\":\"getPluginInterface\"}]", "status": "pass"}], "md": "### 3.5 Discovery lists the provider's methods and events\n\n```bash\ncurl -s --max-time 15 http://127.0.0.1:8645/modules\n```"}, {"execs": [], "md": "## Step 4: Call methods over HTTP\n\n`rpc.call` takes **`module` and `method` as separate fields** \u2014 never a\ndotted `module.method` name. That mirrors the transport spec's own\n`Request`, keeps calls symmetric with subscriptions (which take `module`\nand `event`), and means there is no split rule to get wrong.\n\nThe inner `params` may be an object keyed by parameter name, or a\npositional array. Both are shown below and must produce the same answer."}, {"execs": [{"cmd": "curl -s --max-time 20 -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"rpc.call\",\"params\":{\"module\":\"provider_module\",\"method\":\"greet\",\"params\":{\"who\":\"world\"}}}' \\\n  http://127.0.0.1:8645/rpc\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"id\":1,\"jsonrpc\":\"2.0\",\"result\":\"hello, world\"}", "status": "pass"}], "md": "### 4.1 By-name params\n\n```bash\ncurl -s --max-time 20 -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"rpc.call\",\"params\":{\"module\":\"provider_module\",\"method\":\"greet\",\"params\":{\"who\":\"world\"}}}' \\\n  http://127.0.0.1:8645/rpc\n\n```"}, {"execs": [{"cmd": "curl -s --max-time 20 -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"rpc.call\",\"params\":{\"module\":\"provider_module\",\"method\":\"greet\",\"params\":[\"world\"]}}' \\\n  http://127.0.0.1:8645/rpc\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"id\":2,\"jsonrpc\":\"2.0\",\"result\":\"hello, world\"}", "status": "pass"}], "md": "### 4.2 Positional params mean the same thing\n\n```bash\ncurl -s --max-time 20 -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"rpc.call\",\"params\":{\"module\":\"provider_module\",\"method\":\"greet\",\"params\":[\"world\"]}}' \\\n  http://127.0.0.1:8645/rpc\n\n```"}, {"execs": [{"cmd": "curl -s --max-time 20 -H 'Content-Type: application/json' \\\n  -d '{\"who\":\"world\"}' \\\n  http://127.0.0.1:8645/modules/provider_module/greet\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"result\":\"hello, world\"}", "status": "pass"}], "md": "### 4.3 The REST projection agrees\n\nThe same two-field addressing, expressed in the path.\n\n```bash\ncurl -s --max-time 20 -H 'Content-Type: application/json' \\\n  -d '{\"who\":\"world\"}' \\\n  http://127.0.0.1:8645/modules/provider_module/greet\n\n```"}, {"execs": [{"cmd": "curl -s --max-time 20 -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":3,\"method\":\"rpc.call\",\"params\":{\"module\":\"provider_module\",\"method\":\"mustFail\"}}' \\\n  http://127.0.0.1:8645/rpc\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"id\":3,\"jsonrpc\":\"2.0\",\"result\":{\"error\":\"the widget was not frobnicated\",\"success\":false,\"value\":null}}", "status": "pass"}], "md": "### 4.4 An application failure arrives as a result, not an error\n\n`mustFail()` returned `{success:false, error:\"...\"}`. The module\n**answered** \u2014 so this is a successful call carrying a business\nfailure, and it must not be dressed up as a JSON-RPC error. A client\nthat cannot tell those apart cannot retry correctly.\n\n```bash\ncurl -s --max-time 20 -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":3,\"method\":\"rpc.call\",\"params\":{\"module\":\"provider_module\",\"method\":\"mustFail\"}}' \\\n  http://127.0.0.1:8645/rpc\n\n```"}, {"execs": [], "md": "## Step 5: The refusals\n\nThree properties that are easy to get wrong and silent when you do."}, {"execs": [{"cmd": "echo \"--- denied method ---\"\ncurl -s --max-time 15 -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":4,\"method\":\"rpc.call\",\"params\":{\"module\":\"provider_module\",\"method\":\"denied\"}}' \\\n  http://127.0.0.1:8645/rpc\necho\necho \"--- module that does not exist ---\"\ncurl -s --max-time 15 -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":4,\"method\":\"rpc.call\",\"params\":{\"module\":\"no_such_module\",\"method\":\"denied\"}}' \\\n  http://127.0.0.1:8645/rpc\n", "exit_code": 0, "kind": "run", "note": "", "output": "--- denied method ---\n{\"error\":{\"code\":-32601,\"data\":{\"logos_error_code\":1,\"logos_error_name\":\"METHOD_NOT_FOUND\"},\"message\":\"method not found\"},\"id\":4,\"jsonrpc\":\"2.0\"}\n--- module that does not exist ---\n{\"error\":{\"code\":-32601,\"data\":{\"logos_error_code\":1,\"logos_error_name\":\"METHOD_NOT_FOUND\"},\"message\":\"method not found\"},\"id\":4,\"jsonrpc\":\"2.0\"}", "status": "pass"}], "md": "### 5.1 A denied method and a module that does not exist are byte-identical\n\n`denied` is excluded by config; `no_such_module` was never loaded. If\nthese answered differently, the bridge would be an oracle for what a\nnode is running and what it has been told to hide.\n\n```bash\necho \"--- denied method ---\"\ncurl -s --max-time 15 -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":4,\"method\":\"rpc.call\",\"params\":{\"module\":\"provider_module\",\"method\":\"denied\"}}' \\\n  http://127.0.0.1:8645/rpc\necho\necho \"--- module that does not exist ---\"\ncurl -s --max-time 15 -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":4,\"method\":\"rpc.call\",\"params\":{\"module\":\"no_such_module\",\"method\":\"denied\"}}' \\\n  http://127.0.0.1:8645/rpc\n\n```"}, {"execs": [{"cmd": "curl -s -o /dev/null -w '%{http_code}\\n' --max-time 15 \\\n  -H 'Content-Type: application/json' -H 'Origin: http://evil.example' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":5,\"method\":\"rpc.ping\"}' \\\n  http://127.0.0.1:8645/rpc\n", "exit_code": 0, "kind": "run", "note": "", "output": "403\n", "status": "pass"}], "md": "### 5.2 A browser origin is refused\n\nA loopback bind is **not** a boundary against a browser: browsers do\nnot apply same-origin policy to WebSockets and send no preflight, so\nwithout this check any page the operator visits could drive the node.\n\n```bash\ncurl -s -o /dev/null -w '%{http_code}\\n' --max-time 15 \\\n  -H 'Content-Type: application/json' -H 'Origin: http://evil.example' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":5,\"method\":\"rpc.ping\"}' \\\n  http://127.0.0.1:8645/rpc\n\n```"}, {"execs": [{"cmd": "curl -s -o /dev/null -w '%{http_code}\\n' --max-time 15 \\\n  -H 'Content-Type: text/plain' --data 'x' http://127.0.0.1:8645/rpc\n", "exit_code": 0, "kind": "run", "note": "", "output": "415\n", "status": "pass"}], "md": "### 5.3 A non-JSON content type is refused\n\nRequiring `application/json` forces a CORS preflight that fails, since no CORS headers are ever sent.\n\n```bash\ncurl -s -o /dev/null -w '%{http_code}\\n' --max-time 15 \\\n  -H 'Content-Type: text/plain' --data 'x' http://127.0.0.1:8645/rpc\n\n```"}, {"execs": [], "md": "## Step 6: Subscribe to events from two clients at once\n\nThe WebSocket side carries the same JSON-RPC envelope plus subscriptions\nand server-pushed events.\n\n**The client assigns the subscription id**, per the transport spec, so it\ncan correlate without waiting for the ack. Two clients subscribe to the\nsame event with *different* ids; one upstream subscription is made and\nfanned out, and each client sees the event under its own id."}, {"execs": [{"cmd": "nix build --impure --expr 'let f = builtins.getFlake \"github:NixOS/nixpkgs/nixos-unstable\"; in f.legacyPackages.${builtins.currentSystem}.websocat' -o ws 2>/dev/null || true\nWS=./ws/bin/websocat\n( printf '%s\\n' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"rpc.subscribe\",\"params\":{\"subscription\":\"alpha\",\"module\":\"provider_module\",\"event\":\"tick\"}}'; sleep 8 ) \\\n  | $WS -t ws://127.0.0.1:8645/ws > client-a.txt 2>&1 &\n( printf '%s\\n' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"rpc.subscribe\",\"params\":{\"subscription\":\"beta\",\"module\":\"provider_module\",\"event\":\"tick\"}}'; sleep 8 ) \\\n  | $WS -t ws://127.0.0.1:8645/ws > client-b.txt 2>&1 &\nsleep 3\ncurl -s --max-time 15 -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":9,\"method\":\"rpc.call\",\"params\":{\"module\":\"provider_module\",\"method\":\"fire\",\"params\":{\"value\":42}}}' \\\n  http://127.0.0.1:8645/rpc\necho\nwait\necho \"--- client A ---\"; cat client-a.txt\necho \"--- client B ---\"; cat client-b.txt\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"id\":9,\"jsonrpc\":\"2.0\",\"result\":42}\n--- client A ---\n{\"id\":1,\"jsonrpc\":\"2.0\",\"result\":{\"event\":\"tick\",\"module\":\"provider_module\",\"operation\":\"subscribe\",\"state\":\"registered\",\"subscription\":\"alpha\"}}\n{\"jsonrpc\":\"2.0\",\"method\":\"rpc.event\",\"params\":{\"data\":[42],\"event\":\"tick\",\"generation\":1,\"module\":\"provider_module\",\"subscription\":\"alpha\",\"ts\":1788372897291}}\n--- client B ---\n{\"id\":1,\"jsonrpc\":\"2.0\",\"result\":{\"event\":\"tick\",\"module\":\"provider_module\",\"operation\":\"subscribe\",\"state\":\"registered\",\"subscription\":\"beta\"}}\n{\"jsonrpc\":\"2.0\",\"method\":\"rpc.event\",\"params\":{\"data\":[42],\"event\":\"tick\",\"generation\":1,\"module\":\"provider_module\",\"subscription\":\"beta\",\"ts\":1788372897291}}\n", "status": "pass"}], "md": "### 6.1 Two concurrent subscribers receive the same event\n\n```bash\n# client A\nwebsocat -t ws://127.0.0.1:8645/ws <<< '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"rpc.subscribe\",\n  \"params\":{\"subscription\":\"alpha\",\"module\":\"provider_module\",\"event\":\"tick\"}}'\n\n# client B, same event, its own id\nwebsocat -t ws://127.0.0.1:8645/ws <<< '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"rpc.subscribe\",\n  \"params\":{\"subscription\":\"beta\",\"module\":\"provider_module\",\"event\":\"tick\"}}'\n\n# trigger it\ncurl -s -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":9,\"method\":\"rpc.call\",\n       \"params\":{\"module\":\"provider_module\",\"method\":\"fire\",\"params\":{\"value\":42}}}' \\\n  http://127.0.0.1:8645/rpc\n```"}, {"execs": [], "md": "## Step 7: Stop"}, {"execs": [{"cmd": "./logos/bin/logoscore --config-dir . call json_rpc_bridge stop || true\n./logos/bin/logoscore --config-dir . stop || true\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"stop\",\"module\":\"json_rpc_bridge\",\"result\":{\"error\":null,\"success\":true,\"value\":{\"stopped\":true}},\"status\":\"ok\"}\n{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 7.1 Stop the bridge and the daemon\n\n```bash\nlogoscore call json_rpc_bridge stop\nlogoscore stop\n```"}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
