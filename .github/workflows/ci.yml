name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # libwebsockets is available=false for the mingw cross set in this nixpkgs,
    # so there is no Windows job to add. Linux and macOS are the platforms this
    # module actually builds for.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # DeterminateSystems, not cachix/install-nix-action: the latter fails on
      # current macOS runners with eDSRecordAlreadyExists, because nix is
      # preinstalled and it tries to recreate the nixbld users. This is the same
      # installer doctests.yml uses.
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v15
        with:
          name: logos-co
          skipPush: true

      # Each build is a distinct failure mode: the plugin itself, the packaged
      # artifact (which catches a broken manifest or a missing icon that the
      # plugin build never touches), the docs CLI, and the unit suite.
      - name: Build the plugin
        run: nix build .# -L

      - name: Build the .lgx package
        run: nix build .#lgx -L

      # The offline renderer; it links liblgx, which the plugin never does.
      - name: Build the docs CLI
        run: |
          nix build .#json-rpc-bridge-docs -L
          ./result/bin/json-rpc-bridge-docs --version

      - name: Unit tests
        run: nix flake check -L

      # Also inside `nix flake check`; its own step so a document that breaks
      # its OpenRPC/OpenAPI/AsyncAPI meta-schema is named as such.
      - name: Documents validate against their meta-schemas
        run: nix build ".#checks.$(nix eval --impure --raw --expr builtins.currentSystem).docs-metaschema" -L --no-link
