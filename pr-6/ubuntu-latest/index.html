lved exposure,\n`subscription_continuity` (whether the running protocol can report a\nprovider restart), and `docs`, the snapshot of the self-description\ndocuments."}, {"execs": [{"cmd": "nohup ./logos/bin/logoscore --config-dir . -D -m ./modules > daemon.log 2>&1 &\nsleep 6\n", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 3.1 Start the daemon\n\n```bash\nlogoscore -D -m ./modules\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore --config-dir . load-module provider_module\n./logos/bin/logoscore --config-dir . load-module json_rpc_bridge\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[],\"module\":\"provider_module\",\"status\":\"ok\",\"version\":\"1.0.0\"}\n{\"dependencies_loaded\":[],\"module\":\"json_rpc_bridge\",\"status\":\"ok\",\"version\":\"0.1.0\"}\n", "status": "pass"}], "md": "### 3.2 Load both modules\n\n```bash\nlogoscore load-module provider_module\nlogoscore load-module json_rpc_bridge\n```"}, {"execs": [{"cmd": "printf '%s\\n' '{\"http\":{\"port\":8645},\"expose\":{\"modules\":[{\"name\":\"provider_module\",\"methods\":{\"allow\":[\"greet\",\"mustFail\",\"fire\"]}}]}}' > bridge-config.json\n./logos/bin/logoscore --config-dir . call json_rpc_bridge start \"$(cat bridge-config.json)\"\nsleep 2\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"start\",\"module\":\"json_rpc_bridge\",\"result\":{\"error\":null,\"success\":true,\"value\":{\"auth\":\"none\",\"connections\":0,\"discovery\":{\"revalidate_ms\":10000},\"docs\":{\"build_failures\":0,\"build_ms\":0.495938,\"built_at\":1789601166163,\"generation\":1,\"sizes\":{\"asyncapi\":9203,\"openapi\":11585,\"openrpc\":13636}},\"http\":\"http://127.0.0.1:8645\",\"lidl_reader\":\"lidl 0.1.0 (2043d8b)\",\"modules\":[{\"events\":{\"allow\":null,\"deny\":[]},\"methods\":{\"allow\":[\"fire\",\"greet\",\"mustFail\"],\"deny\":[]},\"name\":\"provider_module\"}],\"protocol_version\":\"0.9.0\",\"running\":true,\"subscription_continuity\":true,\"subscriptions\":0,\"upstream_clients_replaced\":0,\"upstream_subscriptions\":0,\"version\":\"0.1.0\",\"ws\":\"ws://127.0.0.1:8645/ws\"}},\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.3 Start the bridge\n\n```bash\nlogoscore call json_rpc_bridge start '{\n  \"http\": {\"port\": 8645},\n  \"expose\": {\"modules\": [\n    {\"name\": \"provider_module\",\n     \"methods\": {\"allow\": [\"greet\", \"mustFail\", \"fire\"]}}\n  ]}\n}'\n```"}, {"execs": [{"cmd": "curl -s --max-time 15 http://127.0.0.1:8645/healthz", "exit_code": 0, "kind": "run", "note": "", "output": "{\"protocol\":\"json-rpc-2.0\",\"status\":\"ok\",\"uptime_seconds\":2}", "status": "pass"}], "md": "### 3.4 The node is healthy\n\n```bash\ncurl -s --max-time 15 http://127.0.0.1:8645/healthz\n```"}, {"execs": [{"cmd": "status=\"\"\npolls=0\nwhile [ \"$polls\" -lt 60 ]; do\n  polls=$((polls + 1))\n  status=$(curl -s --max-time 5 -H 'Content-Type: application/json' \\\n    -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"rpc.schema\",\"params\":{\"module\":\"provider_module\"}}' \\\n    http://127.0.0.1:8645/rpc |\n    python3 -c 'import json, sys; print(json.load(sys.stdin)[\"result\"][\"interface_status\"])' 2>/dev/null)\n  [ \"$status\" = \"ok\" ] && break\n  sleep 0.5\ndone\nif [ \"$status\" = \"ok\" ]; then\n  echo \"INTERFACE_READY after $polls poll(s)\"\nelse\n  echo \"provider_module was not typed after $polls polls (interface_status: ${status:-no answer})\"\n  exit 1\nfi\n", "exit_code": 0, "kind": "run", "note": "", "output": "INTERFACE_READY after 1 poll(s)\n", "status": "pass"}], "md": "### 3.5 Wait for the provider's contract\n\nDiscovery runs in the background: the bridge reads the provider's\nmethod list, sees `lidl`, calls it, reads the contract, and checks it\nagainst the running module. Until then the module's\n`interface_status` is `pending`.\n\n```bash\ncurl -s -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"rpc.schema\",\"params\":{\"module\":\"provider_module\"}}' \\\n  http://127.0.0.1:8645/rpc      # repeat until \"interface_status\":\"ok\"\n```"}, {"execs": [{"cmd": "curl -s --max-time 15 http://127.0.0.1:8645/modules", "exit_code": 0, "kind": "run", "note": "", "output": "[{\"authoritative\":false,\"contract_sha256\":\"09cb06a8553f6ba2c06ef9bb48ebbb025b2cdbbf3189aedaab6f004d95f90e0c\",\"cross_check\":{\"findings\":[],\"state\":\"consistent\"},\"events\":[\"tick\"],\"events_declared\":true,\"exposure\":{\"events\":[\"tick\"],\"methods\":[\"greet\",\"mustFail\",\"fire\",\"name\",\"version\",\"lidl\"]},\"interface_sha256\":\"7d0baac393e4001591e7867aae1b736f8e96af6d6583170b9560397392254039\",\"interface_status\":\"ok\",\"methods\":[\"greet\",\"mustFail\",\"fire\",\"name\",\"version\",\"lidl\"],\"module\":\"provider_module\",\"resolved\":true,\"source\":\"lidl\",\"stale\":false}]", "status": "pass"}], "md": "### 3.6 Discovery lists the provider's methods and events\n\n```bash\ncurl -s --max-time 15 http://127.0.0.1:8645/modules\n```"}, {"execs": [], "md": "## Step 4: Read the provider's contract\n\n`rpc.schema` is the bridge's view of one module. For a typed module it\ncarries the **complete** contract as `interface`, whatever the policy,\nnext to `exposure`: what this bridge lets you call and subscribe to.\n**Policy restricts calls, not knowledge** \u2014 `internalReset` is in the\ncontract for anyone to read, and still nobody can call it here."}, {"execs": [{"cmd": "curl -s --max-time 15 -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"rpc.schema\",\"params\":{\"module\":\"provider_module\"}}' \\\n  http://127.0.0.1:8645/rpc > schema.json\npython3 - <<'EOF'\nimport json\nview = json.load(open(\"schema.json\"))[\"result\"]\ndeclared = [m[\"name\"] for m in view[\"interface\"][\"methods\"]]\nexposed = view[\"exposure\"][\"methods\"]\nprint(\"interface_status:\", view[\"interface_status\"], \"source:\", view[\"source\"])\nprint(\"declared methods:\", declared)\nprint(\"exposure:\", view[\"exposure\"])\nprint(\"cross_check:\", view[\"cross_check\"][\"state\"])\nif view[\"interface_status\"] == \"ok\" and view[\"source\"] == \"lidl\":\n    print(\"TYPED\")\nif \"internalReset\" in declared and \"internalReset\" not in exposed:\n    print(\"INTERNAL_RESET_DECLARED_NOT_EXPOSED\")\nif all(b in exposed for b in (\"name\", \"version\", \"lidl\")):\n    print(\"BUILTINS_EXPOSED\")\nEOF\n", "exit_code": 0, "kind": "run", "note": "", "output": "interface_status: ok source: lidl\ndeclared methods: ['greet', 'mustFail', 'fire', 'internalReset', 'name', 'version', 'lidl']\nexposure: {'events': ['tick'], 'methods': ['greet', 'mustFail', 'fire', 'name', 'version', 'lidl']}\ncross_check: consistent\nTYPED\nINTERNAL_RESET_DECLARED_NOT_EXPOSED\nBUILTINS_EXPOSED\n", "status": "pass"}], "md": "### 4.1 rpc.schema serves the whole contract and this bridge's exposure\n\n```bash\ncurl -s -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"rpc.schema\",\"params\":{\"module\":\"provider_module\"}}' \\\n  http://127.0.0.1:8645/rpc\n```"}, {"execs": [{"cmd": "curl -s --max-time 15 -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"provider_module.lidl\"}' \\\n  http://127.0.0.1:8645/rpc > lidl-answer.json\npython3 - <<'EOF'\nimport hashlib, json\nanswer = json.load(open(\"lidl-answer.json\"))[\"result\"]\nview = json.load(open(\"schema.json\"))[\"result\"]\nbuilt = open(\"provider-lidl/provider_module.lidl\", \"rb\").read()\nserved = hashlib.sha256(answer.encode(\"utf-8\")).hexdigest()\npublished = hashlib.sha256(built).hexdigest()\nprint(\"sha256(lidl()):   \", served)\nprint(\"contract_sha256:  \", view[\"contract_sha256\"])\nprint(\"sha256(#lidl):    \", published)\nif served == view[\"contract_sha256\"] == published:\n    print(\"DIGEST_MATCHES\")\nEOF\n", "exit_code": 0, "kind": "run", "note": "", "output": "sha256(lidl()):    09cb06a8553f6ba2c06ef9bb48ebbb025b2cdbbf3189aedaab6f004d95f90e0c\ncontract_sha256:   09cb06a8553f6ba2c06ef9bb48ebbb025b2cdbbf3189aedaab6f004d95f90e0c\nsha256(#lidl):     09cb06a8553f6ba2c06ef9bb48ebbb025b2cdbbf3189aedaab6f004d95f90e0c\nDIGEST_MATCHES\n", "status": "pass"}], "md": "### 4.2 lidl() is callable despite the allow list, and is the published contract\n\nThree digests must agree: of the text `provider_module.lidl` returns,\nthe `contract_sha256` the bridge reports, and of the `#lidl` file the\nprovider's build wrote.\n\n```bash\ncurl -s -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"provider_module.lidl\"}' \\\n  http://127.0.0.1:8645/rpc\n```"}, {"execs": [], "md": "## Step 5: Call methods over HTTP\n\nA JSON-RPC method named `<module>.<method>` is an **alias**: exactly\n`rpc.call` with `module` and `method` as separate fields, which is how\ngenerated OpenRPC clients name operations. `rpc.call` itself keeps the two\nfields apart, mirroring the transport spec's own `Request`; the alias\nsplits at the first `.`, which is unambiguous because module names cannot\ncontain one.\n\nThe params may be an object keyed by parameter name, or a positional\narray. Both are shown below and must produce the same answer."}, {"execs": [{"cmd": "curl -s --max-time 20 -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"provider_module.greet\",\"params\":{\"who\":\"alias\"}}' \\\n  http://127.0.0.1:8645/rpc\necho\ncurl -s --max-time 20 -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"provider_module.version\"}' \\\n  http://127.0.0.1:8645/rpc\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"id\":1,\"jsonrpc\":\"2.0\",\"result\":\"hello, alias\"}\n{\"id\":2,\"jsonrpc\":\"2.0\",\"result\":\"1.0.0\"}", "status": "pass"}], "md": "### 5.1 Aliases call the provider and its built-ins\n\n```bash\ncurl -s --max-time 20 -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"provider_module.greet\",\"params\":{\"who\":\"alias\"}}' \\\n  http://127.0.0.1:8645/rpc\necho\ncurl -s --max-time 20 -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"provider_module.version\"}' \\\n  http://127.0.0.1:8645/rpc\n\n```"}, {"execs": [{"cmd": "curl -s --max-time 20 -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"rpc.call\",\"params\":{\"module\":\"provider_module\",\"method\":\"greet\",\"params\":{\"who\":\"world\"}}}' \\\n  http://127.0.0.1:8645/rpc\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"id\":1,\"jsonrpc\":\"2.0\",\"result\":\"hello, world\"}", "status": "pass"}], "md": "### 5.2 By-name params\n\n```bash\ncurl -s --max-time 20 -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"rpc.call\",\"params\":{\"module\":\"provider_module\",\"method\":\"greet\",\"params\":{\"who\":\"world\"}}}' \\\n  http://127.0.0.1:8645/rpc\n\n```"}, {"execs": [{"cmd": "curl -s --max-time 20 -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"rpc.call\",\"params\":{\"module\":\"provider_module\",\"method\":\"greet\",\"params\":[\"world\"]}}' \\\n  http://127.0.0.1:8645/rpc\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"id\":2,\"jsonrpc\":\"2.0\",\"result\":\"hello, world\"}", "status": "pass"}], "md": "### 5.3 Positional params mean the same thing\n\n```bash\ncurl -s --max-time 20 -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"rpc.call\",\"params\":{\"module\":\"provider_module\",\"method\":\"greet\",\"params\":[\"world\"]}}' \\\n  http://127.0.0.1:8645/rpc\n\n```"}, {"execs": [{"cmd": "curl -s --max-time 20 -H 'Content-Type: application/json' \\\n  -d '{\"who\":\"world\"}' \\\n  http://127.0.0.1:8645/modules/provider_module/greet\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"result\":\"hello, world\"}", "status": "pass"}], "md": "### 5.4 The REST projection agrees\n\nThe same two-field addressing, expressed in the path.\n\n```bash\ncurl -s --max-time 20 -H 'Content-Type: application/json' \\\n  -d '{\"who\":\"world\"}' \\\n  http://127.0.0.1:8645/modules/provider_module/greet\n\n```"}, {"execs": [{"cmd": "curl -s --max-time 20 -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":3,\"method\":\"provider_module.mustFail\"}' \\\n  http://127.0.0.1:8645/rpc > must-fail.json\ncat must-fail.json\necho\npython3 - <<'EOF'\nimport json\nreply = json.load(open(\"must-fail.json\"))\nif \"error\" not in reply and reply[\"result\"][\"success\"] is False:\n    print(\"APPLICATION_FAILURE_IS_A_RESULT\")\nEOF\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"id\":3,\"jsonrpc\":\"2.0\",\"result\":{\"error\":\"the widget was not frobnicated\",\"success\":false,\"value\":null}}\nAPPLICATION_FAILURE_IS_A_RESULT\n", "status": "pass"}], "md": "### 5.5 An application failure arrives as a result, not an error\n\n`mustFail()` returned `{success:false, error:\"...\"}`. The module\n**answered** \u2014 so this is a successful call carrying a business\nfailure, and it must not be dressed up as a JSON-RPC error. A client\nthat cannot tell those apart cannot retry correctly.\n\n```bash\ncurl -s -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":3,\"method\":\"provider_module.mustFail\"}' \\\n  http://127.0.0.1:8645/rpc\n```"}, {"execs": [], "md": "## Step 6: The refusals\n\nThree properties that are easy to get wrong and silent when you do."}, {"execs": [{"cmd": "refuse() {\n  curl -s --max-time 15 -H 'Content-Type: application/json' -d \"$1\" http://127.0.0.1:8645/rpc\n}\nrefuse '{\"jsonrpc\":\"2.0\",\"id\":4,\"method\":\"provider_module.internalReset\"}' > refused-alias.json\nrefuse '{\"jsonrpc\":\"2.0\",\"id\":4,\"method\":\"rpc.call\",\"params\":{\"module\":\"provider_module\",\"method\":\"internalReset\"}}' > refused-call.json\nrefuse '{\"jsonrpc\":\"2.0\",\"id\":4,\"method\":\"rpc.call\",\"params\":{\"module\":\"no_such_module\",\"method\":\"internalReset\"}}' > refused-module.json\nrefuse '{\"jsonrpc\":\"2.0\",\"id\":4,\"method\":\"no_such_module.internalReset\"}' > refused-module-alias.json\nfor f in refused-alias refused-call refused-module refused-module-alias; do\n  echo \"--- $f\"; cat \"$f.json\"; echo\ndone\nif cmp -s refused-alias.json refused-call.json &&\n   cmp -s refused-call.json refused-module.json &&\n   cmp -s refused-module.json refused-module-alias.json &&\n   grep -q '\"code\":-32601' refused-alias.json; then\n  echo \"REFUSALS_IDENTICAL\"\nfi\n", "exit_code": 0, "kind": "run", "note": "", "output": "--- refused-alias\n{\"error\":{\"code\":-32601,\"data\":{\"logos_error_code\":1,\"logos_error_name\":\"METHOD_NOT_FOUND\"},\"message\":\"method not found\"},\"id\":4,\"jsonrpc\":\"2.0\"}\n--- refused-call\n{\"error\":{\"code\":-32601,\"data\":{\"logos_error_code\":1,\"logos_error_name\":\"METHOD_NOT_FOUND\"},\"message\":\"method not found\"},\"id\":4,\"jsonrpc\":\"2.0\"}\n--- refused-module\n{\"error\":{\"code\":-32601,\"data\":{\"logos_error_code\":1,\"logos_error_name\":\"METHOD_NOT_FOUND\"},\"message\":\"method not found\"},\"id\":4,\"jsonrpc\":\"2.0\"}\n--- refused-module-alias\n{\"error\":{\"code\":-32601,\"data\":{\"logos_error_code\":1,\"logos_error_name\":\"METHOD_NOT_FOUND\"},\"message\":\"method not found\"},\"id\":4,\"jsonrpc\":\"2.0\"}\nREFUSALS_IDENTICAL\n", "status": "pass"}], "md": "### 6.1 A denied method, a denied call and a missing module are byte-identical\n\n`internalReset` is left out by the allow list; `no_such_module` was\nnever loaded. If these answered differently, the bridge would be an\noracle for what a node is running and what it has been told to hide.\nThe contract is public \u2014 the refusal is not a secret-keeper, it only\nstops the call.\n\n```bash\n# denied, through the alias and through rpc.call\ncurl -s -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":4,\"method\":\"provider_module.internalReset\"}' \\\n  http://127.0.0.1:8645/rpc\ncurl -s -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":4,\"method\":\"rpc.call\",\n       \"params\":{\"module\":\"provider_module\",\"method\":\"internalReset\"}}' \\\n  http://127.0.0.1:8645/rpc\n\n# a module that does not exist\ncurl -s -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":4,\"method\":\"rpc.call\",\n       \"params\":{\"module\":\"no_such_module\",\"method\":\"internalReset\"}}' \\\n  http://127.0.0.1:8645/rpc\n```"}, {"execs": [{"cmd": "curl -s -o /dev/null -w 'rpc: %{http_code}\\n' --max-time 15 \\\n  -H 'Content-Type: application/json' -H 'Origin: http://evil.example' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":5,\"method\":\"rpc.ping\"}' \\\n  http://127.0.0.1:8645/rpc\ncurl -s -o /dev/null -w 'openapi: %{http_code}\\n' --max-time 15 \\\n  -H 'Origin: http://evil.example' http://127.0.0.1:8645/openapi.json\n", "exit_code": 0, "kind": "run", "note": "", "output": "rpc: 403\nopenapi: 403\n", "status": "pass"}], "md": "### 6.2 A browser origin is refused\n\nA loopback bind is **not** a boundary against a browser: browsers do\nnot apply same-origin policy to WebSockets and send no preflight, so\nwithout this check any page the operator visits could drive the node.\nThe document routes are gated the same way.\n\n```bash\ncurl -s -o /dev/null -w 'rpc: %{http_code}\\n' --max-time 15 \\\n  -H 'Content-Type: application/json' -H 'Origin: http://evil.example' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":5,\"method\":\"rpc.ping\"}' \\\n  http://127.0.0.1:8645/rpc\ncurl -s -o /dev/null -w 'openapi: %{http_code}\\n' --max-time 15 \\\n  -H 'Origin: http://evil.example' http://127.0.0.1:8645/openapi.json\n\n```"}, {"execs": [{"cmd": "curl -s -o /dev/null -w '%{http_code}\\n' --max-time 15 \\\n  -H 'Content-Type: text/plain' --data 'x' http://127.0.0.1:8645/rpc\n", "exit_code": 0, "kind": "run", "note": "", "output": "415\n", "status": "pass"}], "md": "### 6.3 A non-JSON content type is refused\n\nRequiring `application/json` forces a CORS preflight that fails, since no CORS headers are ever sent.\n\n```bash\ncurl -s -o /dev/null -w '%{http_code}\\n' --max-time 15 \\\n  -H 'Content-Type: text/plain' --data 'x' http://127.0.0.1:8645/rpc\n\n```"}, {"execs": [], "md": "## Step 7: The self-description documents\n\nThe bridge describes itself three ways: `rpc.discover` answers an OpenRPC\n1.3.2 document, `GET /openapi.json` an OpenAPI 3.1.1 one for the HTTP\nroutes, and `GET /asyncapi.json` an AsyncAPI 3.0.0 one for the WebSocket.\nTheir operations cover exactly what this bridge lets you call and\nsubscribe to, so a client generated from them never contains a call the\nbridge refuses. Types come from the provider's contract."}, {"execs": [{"cmd": "curl -s --max-time 15 -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"rpc.discover\"}' \\\n  http://127.0.0.1:8645/rpc > discover.json\ncurl -s --max-time 15 -o openapi.json -w 'openapi.json: HTTP %{http_code}, %{size_download} bytes\\n' \\\n  http://127.0.0.1:8645/openapi.json\ncurl -s --max-time 15 -o asyncapi.json -w 'asyncapi.json: HTTP %{http_code}, %{size_download} bytes\\n' \\\n  http://127.0.0.1:8645/asyncapi.json\npython3 - <<'EOF'\nimport json\nrpc = json.load(open(\"discover.json\"))[\"result\"]\napi = json.load(open(\"openapi.json\"))\naapi = json.load(open(\"asyncapi.json\"))\nprint(\"openrpc\", rpc[\"openrpc\"], \"| openapi\", api[\"openapi\"], \"| asyncapi\", aapi[\"asyncapi\"])\ngreet = next(m for m in rpc[\"methods\"] if m[\"name\"] == \"provider_module.greet\")\nprint(\"provider_module.greet params:\", greet[\"params\"])\nif (\"/modules/provider_module/greet\" in api[\"paths\"]\n        and \"provider_module.greet.request\" in aapi[\"components\"][\"messages\"]\n        and greet[\"params\"][0][\"schema\"] == {\"type\": \"string\"}):\n    print(\"DOCUMENTS_PARSE\")\nEOF\n", "exit_code": 0, "kind": "run", "note": "", "output": "openapi.json: HTTP 200, 19133 bytes\nasyncapi.json: HTTP 200, 25302 bytes\nopenrpc 1.3.2 | openapi 3.1.1 | asyncapi 3.0.0\nprovider_module.greet params: [{'name': 'who', 'required': True, 'schema': {'type': 'string'}}]\nDOCUMENTS_PARSE\n", "status": "pass"}], "md": "### 7.1 Fetch the three documents\n\n```bash\ncurl -s -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"rpc.discover\"}' http://127.0.0.1:8645/rpc\ncurl -s http://127.0.0.1:8645/openapi.json\ncurl -s http://127.0.0.1:8645/asyncapi.json\n```"}, {"execs": [{"cmd": "python3 - <<'EOF'\nimport json\n\ndef targets(node, found):\n    if isinstance(node, dict):\n        if \"x-logos-module\" in node:\n            found.append((node[\"x-logos-module\"],\n                          node.get(\"x-logos-method\") or node.get(\"x-logos-event\")))\n        for value in node.values():\n            targets(value, found)\n    elif isinstance(node, list):\n        for value in node:\n            targets(value, found)\n\ndocs = {\n    \"openrpc\": json.load(open(\"discover.json\"))[\"result\"],\n    \"openapi\": json.load(open(\"openapi.json\")),\n    \"asyncapi\": json.load(open(\"asyncapi.json\")),\n}\nclean = True\nfor kind, doc in docs.items():\n    found = []\n    targets(doc, found)\n    denied = [t for t in found if t[1] == \"internalReset\"]\n    offers_lidl = (\"provider_module\", \"lidl\") in found\n    mentions = \"internalReset\" in json.dumps(doc)\n    print(kind, \"- operations:\", len(found), \"denied:\", len(denied),\n          \"offers lidl:\", offers_lidl, \"mentions internalReset:\", mentions)\n    clean = clean and found and not denied and offers_lidl and not mentions\nif clean:\n    print(\"NO_DENIED_OPERATIONS\")\nEOF\n", "exit_code": 0, "kind": "run", "note": "", "output": "openrpc - operations: 6 denied: 0 offers lidl: True mentions internalReset: False\nopenapi - operations: 6 denied: 0 offers lidl: True mentions internalReset: False\nasyncapi - operations: 23 denied: 0 offers lidl: True mentions internalReset: False\nNO_DENIED_OPERATIONS\n", "status": "pass"}], "md": "### 7.2 No document offers the denied method\n\nEvery operation names its target with `x-logos-module` and\n`x-logos-method` (or `x-logos-event`). `internalReset` must be the\ntarget of none, while the built-in `lidl` must be offered.\n\n```bash\npython3 - <<'EOF'\nimport json\n\ndef targets(node, found):\n    if isinstance(node, dict):\n        if \"x-logos-module\" in node:\n            found.append((node[\"x-logos-module\"],\n                          node.get(\"x-logos-method\") or node.get(\"x-logos-event\")))\n        for value in node.values():\n            targets(value, found)\n    elif isinstance(node, list):\n        for value in node:\n            targets(value, found)\n\ndocs = {\n    \"openrpc\": json.load(open(\"discover.json\"))[\"result\"],\n    \"openapi\": json.load(open(\"openapi.json\")),\n    \"asyncapi\": json.load(open(\"asyncapi.json\")),\n}\nclean = True\nfor kind, doc in docs.items():\n    found = []\n    targets(doc, found)\n    denied = [t for t in found if t[1] == \"internalReset\"]\n    offers_lidl = (\"provider_module\", \"lidl\") in found\n    mentions = \"internalReset\" in json.dumps(doc)\n    print(kind, \"- operations:\", len(found), \"denied:\", len(denied),\n          \"offers lidl:\", offers_lidl, \"mentions internalReset:\", mentions)\n    clean = clean and found and not denied and offers_lidl and not mentions\nif clean:\n    print(\"NO_DENIED_OPERATIONS\")\nEOF\n\n```"}, {"execs": [{"cmd": "version=$(python3 -c 'import json; print(json.load(open(\"discover.json\"))[\"result\"][\"info\"][\"version\"])')\nfor kind in openrpc openapi asyncapi; do\n  ./docs-cli/bin/json-rpc-bridge-docs --config bridge-config.json --format \"$kind\" \\\n    --lidl provider_module=provider-lidl/provider_module.lidl \\\n    --info-version \"$version\" > \"offline-$kind.json\"\ndone\ncmp openapi.json offline-openapi.json && cmp asyncapi.json offline-asyncapi.json &&\n  echo \"OFFLINE_BYTES_MATCH\"\npython3 - <<'EOF'\nimport json\nserved = {\n    \"openrpc\": json.load(open(\"discover.json\"))[\"result\"],\n    \"openapi\": json.load(open(\"openapi.json\")),\n    \"asyncapi\": json.load(open(\"asyncapi.json\")),\n}\nsame = [kind for kind in served if json.load(open(\"offline-%s.json\" % kind)) == served[kind]]\nprint(\"identical:\", same)\nif len(same) == 3:\n    print(\"OFFLINE_MATCHES_SERVED\")\nEOF\n", "exit_code": 0, "kind": "run", "note": "", "output": "OFFLINE_BYTES_MATCH\nidentical: ['openrpc', 'openapi', 'asyncapi']\nOFFLINE_MATCHES_SERVED\n", "status": "pass"}], "md": "### 7.3 The offline renderer produces the same documents\n\n`json-rpc-bridge-docs` renders what a bridge started with this config\nserves, from the provider's `.lidl` file alone. `--info-version` pins\nthe version the documents carry to the one the running bridge reports.\n\n```bash\njson-rpc-bridge-docs --config bridge-config.json --format openapi \\\n  --lidl provider_module=provider-lidl/provider_module.lidl --info-version 0.1.0\n```"}, {"execs": [], "md": "## Step 8: Subscribe to events from two clients at once\n\nThe WebSocket side carries the same JSON-RPC envelope plus subscriptions\nand server-pushed events.\n\n**The client assigns the subscription id**, per the transport spec, so it\ncan correlate without waiting for the ack. Two clients subscribe to the\nsame event with *different* ids; one upstream subscription is made and\nfanned out, and each client sees the event under its own id. The event is\ntriggered with the `provider_module.fire` alias."}, {"execs": [{"cmd": "nix build --impure --expr 'let f = builtins.getFlake \"github:NixOS/nixpkgs/nixos-unstable\"; in f.legacyPackages.${builtins.currentSystem}.websocat' -o ws 2>/dev/null || true\nWS=./ws/bin/websocat\n( printf '%s\\n' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"rpc.subscribe\",\"params\":{\"subscription\":\"alpha\",\"module\":\"provider_module\",\"event\":\"tick\"}}'; sleep 8 ) \\\n  | $WS -t ws://127.0.0.1:8645/ws > client-a.txt 2>&1 &\n( printf '%s\\n' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"rpc.subscribe\",\"params\":{\"subscription\":\"beta\",\"module\":\"provider_module\",\"event\":\"tick\"}}'; sleep 8 ) \\\n  | $WS -t ws://127.0.0.1:8645/ws > client-b.txt 2>&1 &\nsleep 3\ncurl -s --max-time 15 -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":9,\"method\":\"provider_module.fire\",\"params\":{\"value\":42}}' \\\n  http://127.0.0.1:8645/rpc\necho\nwait\necho \"--- client A ---\"; cat client-a.txt\necho \"--- client B ---\"; cat client-b.txt\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"id\":9,\"jsonrpc\":\"2.0\",\"result\":42}\n--- client A ---\n{\"id\":1,\"jsonrpc\":\"2.0\",\"result\":{\"event\":\"tick\",\"module\":\"provider_module\",\"operation\":\"subscribe\",\"state\":\"registered\",\"subscription\":\"alpha\"}}\n{\"jsonrpc\":\"2.0\",\"method\":\"rpc.event\",\"params\":{\"data\":[42],\"event\":\"tick\",\"generation\":1,\"module\":\"provider_module\",\"subscription\":\"alpha\",\"ts\":1789601179211}}\n--- client B ---\n{\"id\":1,\"jsonrpc\":\"2.0\",\"result\":{\"event\":\"tick\",\"module\":\"provider_module\",\"operation\":\"subscribe\",\"state\":\"registered\",\"subscription\":\"beta\"}}\n{\"jsonrpc\":\"2.0\",\"method\":\"rpc.event\",\"params\":{\"data\":[42],\"event\":\"tick\",\"generation\":1,\"module\":\"provider_module\",\"subscription\":\"beta\",\"ts\":1789601179211}}\n", "status": "pass"}], "md": "### 8.1 Two concurrent subscribers receive the same event\n\n```bash\n# client A\nwebsocat -t ws://127.0.0.1:8645/ws <<< '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"rpc.subscribe\",\n  \"params\":{\"subscription\":\"alpha\",\"module\":\"provider_module\",\"event\":\"tick\"}}'\n\n# client B, same event, its own id\nwebsocat -t ws://127.0.0.1:8645/ws <<< '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"rpc.subscribe\",\n  \"params\":{\"subscription\":\"beta\",\"module\":\"provider_module\",\"event\":\"tick\"}}'\n\n# trigger it\ncurl -s -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":9,\"method\":\"provider_module.fire\",\"params\":{\"value\":42}}' \\\n  http://127.0.0.1:8645/rpc\n```"}, {"execs": [], "md": "## Step 9: A pooled HTTP client does not lock out WebSocket clients\n\nThe bridge bounds connections **per peer** (8 by default), and every\nloopback client is the same peer. An HTTP client that keeps its\nconnection alive (curl with several URLs, `requests.Session`, any\nconnection pool) holds **one** of those slots, however many requests it\nsends over that connection.\n\nIf every request took a slot of its own, twelve requests over one\nconnection would use up the bound, and the next WebSocket client would be\nrefused until the bridge restarted."}, {"execs": [{"cmd": "curl -s --max-time 30 -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"rpc.ping\"}' \\\n  -w '\\nconnects=%{num_connects}\\n' \\\n  \"http://127.0.0.1:8645/rpc?n=[1-12]\" > keepalive.txt\necho \"answered: $(grep -c '\"result\":\"pong\"' keepalive.txt)\"\necho \"connections opened: $(grep -c '^connects=1$' keepalive.txt)\"\nnix build --impure --expr 'let f = builtins.getFlake \"github:NixOS/nixpkgs/nixos-unstable\"; in f.legacyPackages.${builtins.currentSystem}.websocat' -o ws 2>/dev/null || true\nWS=./ws/bin/websocat\n( printf '%s\\n' '{\"jsonrpc\":\"2.0\",\"id\":\"after-keepalive\",\"method\":\"rpc.ping\"}'; sleep 3 ) \\\n  | $WS -t ws://127.0.0.1:8645/ws > after-keepalive.txt 2>&1\ncat after-keepalive.txt\n", "exit_code": 0, "kind": "run", "note": "", "output": "answered: 12\nconnections opened: 1\n{\"id\":\"after-keepalive\",\"jsonrpc\":\"2.0\",\"result\":\"pong\"}\n", "status": "pass"}], "md": "### 9.1 Twelve requests over one connection, then a WebSocket client\n\ncurl sends all twelve requests over the same connection. For each\nrequest it reports `num_connects`: `1` for the request that opened the\nconnection, and `0` for each request that reused it.\n\n```bash\n# twelve pings; curl reuses one connection for all of them\ncurl -s -H 'Content-Type: application/json' \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"rpc.ping\"}' \\\n  -w '\\nconnects=%{num_connects}\\n' \\\n  \"http://127.0.0.1:8645/rpc?n=[1-12]\"\n\n# a WebSocket client is still admitted\nwebsocat -t ws://127.0.0.1:8645/ws <<< '{\"jsonrpc\":\"2.0\",\"id\":\"after-keepalive\",\"method\":\"rpc.ping\"}'\n```"}, {"execs": [], "md": "## Step 10: Stop"}, {"execs": [{"cmd": "./logos/bin/logoscore --config-dir . call json_rpc_bridge stop || true\n./logos/bin/logoscore --config-dir . stop || true\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"stop\",\"module\":\"json_rpc_bridge\",\"result\":{\"error\":null,\"success\":true,\"value\":{\"stopped\":true}},\"status\":\"ok\"}\n{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 10.1 Stop the bridge and the daemon\n\n```bash\nlogoscore call json_rpc_bridge stop\nlogoscore stop\n```"}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
